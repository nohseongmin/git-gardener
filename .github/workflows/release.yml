name: Build and release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/GitGardener/GitGardener.csproj
          if ($env:RELEASE_TAG -ne "v$($project.Project.PropertyGroup.Version)") { throw "Tag/version mismatch" }
      - run: dotnet publish src/GitGardener -c Release -r win-x64 --self-contained -p:PublishSingleFile=true
      - name: Collect executable
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item src/GitGardener/bin/Release/net9.0-windows/win-x64/publish/GitGardener.exe out/

      - name: Checksum
        shell: pwsh
        run: |
          $taskHashes = Get-ChildItem out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'out/SHA256SUMS.txt'), ($taskHashes -join "`n") + "`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd out
          sha256sum -c SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" * --clobber
          else
            gh release create "$RELEASE_TAG" * --verify-tag --generate-notes --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false
